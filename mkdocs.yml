          - Versioning: labs/s3/03_versioning.md
          - Cross-Region Replication: labs/s3/04_cross_region_replication.md
          - Storage Classes & Lifecycle: labs/s3/05_storage_classes_and_life_cycle.md
          - Event Notifications to SQS: labs/s3/06_event_notification.md
          - Encryption: labs/s3/07_encryption.md
          - CORS: labs/s3/08_cors.md
          - MFA Delete: labs/s3/09_mfa_delete.md
      - CloudFront:
          - Distribution with S3 Origin (OAC): labs/cloudfront/01_cloudfront_distribution_with_s3_origin.md
          - Cache Invalidation: labs/cloudfront/02_cache_invalidation.md
      - SQS:
          - Dead-Letter Queue & Redrive: labs/sqs/01_dead_letter_queue.md
      - SNS:
          - Topic with an Email Subscription: labs/sns/01_email_subscription.md
      - Kinesis:
